<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedAtlas · 影像研究助手</title><link rel="stylesheet" href="/style.css"></head><body>
<aside class="sidebar" id="sidebar"><a class="brand" href="/">✳ <span>MedAtlas</span></a><button id="new-chat" class="new-chat"><span>＋</span> 新对话 <kbd>Ctrl K</kbd></button><div class="search"><span>⌕</span><input id="chat-search" placeholder="搜索对话" aria-label="搜索对话"></div><div class="history-label">最近对话</div><nav id="conversations" aria-label="会话记录"></nav><div class="sidebar-bottom"><span class="avatar">M</span><div>本地工作空间<small>影像留在本机处理</small></div><span class="online-dot"></span></div></aside>
<div class="main"><header class="topbar"><div class="top-left"><button id="toggle-sidebar" class="icon-btn" title="切换侧栏" aria-label="切换侧栏">☰</button><button class="model-button" id="model-settings"><b>MedAtlas</b><span id="model-label">影像研究助手</span><span class="chevron">⌄</span></button></div><nav class="top-menu" aria-label="顶部菜单"><div class="menu-wrap"><button id="file-menu-button">文件</button><div class="dropdown" id="file-menu" hidden><button id="menu-upload">添加 NIfTI 影像</button><button id="menu-demo">加载合成演示影像</button><button id="menu-new">新建对话</button></div></div><button id="knowledge-button">知识库</button><button id="settings-button">设置</button></nav><span id="connection-dot" class="connection-dot" title="本地服务状态"></span></header>
<div class="chat-scroll" id="chat-scroll"><div class="chat-column"><div id="welcome" class="welcome"><div class="welcome-symbol">✳</div><h1>今天想分析哪份影像？</h1><p>添加 CT 影像，从器官分割到方法解释，<br>在一个对话里完成。</p><div class="suggestions"><button id="suggest-image"><span>◈</span><b>分析 CT 影像</b><small>上传 NIfTI，分割并量化器官</small></button><button id="suggest-question"><span>▤</span><b>了解分析方法</b><small>结合资料解释指标与局限</small></button><button id="suggest-demo"><span>✧</span><b>先试一个样例</b><small>使用合成影像体验本地流程</small></button></div></div><div id="messages" role="log" aria-label="聊天消息" aria-live="polite"></div><div id="scroll-anchor"></div></div></div>
<div class="composer-area"><div id="connection-banner" class="connection-banner" hidden></div><div class="composer"><div id="attachment" class="attachment" hidden></div><textarea id="prompt" rows="1" placeholder="输入问题，或添加 .nii / .nii.gz 影像…" aria-label="消息输入框"></textarea><div class="composer-toolbar"><div class="composer-tools"><button class="icon-btn" id="attach-button" title="添加 NIfTI 影像" aria-label="添加 NIfTI 影像">＋</button><button id="options-button" class="tool-pill">⚙ 分析选项</button><span id="local-chip" class="local-chip" hidden>本地工具模式</span></div><button id="send" class="send" aria-label="发送消息" title="发送消息">↑</button><button id="stop" class="send stop" aria-label="停止生成" title="停止生成" hidden>■</button></div></div><div class="composer-note">仅用于研究分析。请核查模型结果与引用来源。<span>Enter 发送 · Shift + Enter 换行</span></div></div></div>
<input id="file" type="file" accept=".nii,.nii.gz" hidden>
<dialog id="options-dialog"><div class="dialog-head"><h2>分析选项</h2><button class="close icon-btn" aria-label="关闭">×</button></div><p class="muted">设置本次影像分析允许使用的器官和执行方式。</p><label class="field-label">目标器官</label><div class="organs"><label><input type="checkbox" value="liver" checked>肝脏</label><label><input type="checkbox" value="spleen" checked>脾脏</label><label><input type="checkbox" value="kidney_left" checked>左肾</label><label><input type="checkbox" value="kidney_right" checked>右肾</label></div><label class="option-row"><input type="checkbox" id="fast" checked><div>快速分割<small>使用较低分辨率，适合流程验证</small></div></label><label class="option-row"><input type="checkbox" id="local-only"><div>仅使用本地工具<small>不调用大模型；仍可分割影像和检索资料</small></div></label><button class="primary close">完成</button></dialog>
<dialog id="knowledge-dialog" class="wide-dialog"><div class="dialog-head"><div><h2>知识库</h2><p class="muted" id="kb-mode">加载中</p></div><button class="close icon-btn" aria-label="关闭知识库">×</button></div><div class="kb-toolbar"><input id="kb-query" placeholder="搜索资料内容" aria-label="搜索知识库"><button id="kb-search" class="secondary">检索</button><button id="kb-add-toggle" class="primary compact">＋ 添加资料</button></div><form id="kb-form" hidden><label class="field-label">标题<input id="kb-title" required maxlength="300" placeholder="文献或方法说明标题"></label><label class="field-label">来源链接<input id="kb-source" placeholder="https://...（可留空）"></label><label class="field-label">正文<textarea id="kb-text" rows="6" required placeholder="粘贴有权使用的公开资料"></textarea></label><button class="primary compact" id="kb-save">保存资料</button></form><div class="kb-summary"><span id="kb-count"></span><button id="kb-index" class="text-btn">重建向量索引</button></div><div id="kb-list"></div></dialog>
<dialog id="settings-dialog"><div class="dialog-head"><h2>连接与运行状态</h2><button class="close icon-btn" aria-label="关闭设置">×</button></div><dl id="settings-info"></dl><p class="muted">密钥只从本地 .env 读取，不会在页面显示。修改配置后需要重启服务。</p><button id="test-connection" class="primary">测试大模型连接</button></dialog>
<div id="toast" role="status" hidden></div><script src="/app.js"></script></body></html>
